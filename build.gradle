plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.0'
    id 'com.github.johnrengelman.shadow' version '8.0.0'
    id 'maven-publish'
}

group = 'dev.sora.relay'
version = '1.4.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://libraries.minecraft.net/' }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.2"

    // Minecraft/Bedrock
    embed('com.github.CloudburstMC.Protocol:bedrock-connection:3.0.0.Beta1') {
        exclude group: 'com.nukkitx', module: 'natives'
    }

    // Auth
    embed 'com.github.MCMrARM:msft-auth-kotlin:1.0.0'

    // LevelDB
    embed 'org.iq80.leveldb:leveldb:0.12'

    // Utilities
    embed 'com.google.code.gson:gson:2.10.1'
    embed('com.squareup.okhttp3:okhttp:4.11.0') {
        exclude group: 'org.jetbrains.kotlin'
    }
    
    // Security
    embed 'commons-codec:commons-codec:1.15'
}

kotlin {
    jvmToolchain(17)
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.embed]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes 'Main-Class': 'dev.sora.relay.MainKt'
    }
    
    relocate 'com.google', 'shadow.com.google'
    relocate 'okhttp3', 'shadow.okhttp3'
    relocate 'okio', 'shadow.okio'
}

publishing {
    publications {
        shadow(MavenPublication) { 
            from components.java
            artifactId = 'relay'
            pom {
                description = 'A Minecraft relay library'
                url = 'https://github.com/your-repo/relay'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.22' // Güncel Kotlin sürümü
    id 'com.github.johnrengelman.shadow' version '8.1.1' // Güncel Shadow sürümü
    id 'maven-publish'
}

group = 'dev.sora.relay'
version = '1.4.1' // Versiyonu güncelledim

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.opencollab.dev/maven-releases/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url 'https://libraries.minecraft.net/' }
    // CloudburstMC için alternatif repo
    maven { 
        url 'https://repo.cloudburstmc.org/releases/'
        allowInsecureProtocol = true // HTTPS sorunları için
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3" // Güncel sürüm

    // Minecraft/Bedrock - Alternatif bağımlılık
    embed('org.cloudburstmc:bedrock-connection:3.0.1.Final') { // Daha stabil sürüm
        exclude group: 'com.nukkitx', module: 'natives'
    }

    // Auth - Çalışan alternatif
    implementation 'com.github.JellySquid3:msft-auth:2.0.0' // Güncel sürüm

    // LevelDB
    implementation 'org.iq80.leveldb:leveldb:0.12'

    // Utilities
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // Güncel sürüm
    
    // Security
    implementation 'commons-codec:commons-codec:1.16.0' // Güncel sürüm

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
}

kotlin {
    jvmToolchain(17)
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.embed]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes 'Main-Class': 'dev.sora.relay.MainKt'
    }
    
    relocate 'com.google', 'shadow.com.google'
    relocate 'okhttp3', 'shadow.okhttp3'
    relocate 'okio', 'shadow.okio'
}

publishing {
    publications {
        shadow(MavenPublication) { 
            from components.java
            artifactId = 'relay'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty "file.encoding", "UTF-8"
}

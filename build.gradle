plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

group = 'dev.sora.relay'
version = '1.4.1'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.opencollab.dev/maven-releases/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url 'https://libraries.minecraft.net/' }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    // LevelDB
    implementation 'org.iq80.leveldb:leveldb:0.12'

    // Utilities
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Security
    implementation 'commons-codec:commons-codec:1.16.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    // Minecraft/Bedrock alternatif kütüphane (CloudBurstMC yerine)
    implementation 'com.github.CloudburstMC:Protocol:3.0.0' // JitPack üzerinden alternatif
}

kotlin {
    jvmToolchain(17)
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.embed]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes 'Main-Class': 'dev.sora.relay.MainKt'
    }
    
    relocate 'com.google', 'shadow.com.google'
    relocate 'okhttp3', 'shadow.okhttp3'
    relocate 'okio', 'shadow.okio'
}

publishing {
    publications {
        shadow(MavenPublication) { 
            from components.java
            artifactId = 'relay'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty "file.encoding", "UTF-8"
}

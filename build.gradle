plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.0'
    id 'com.github.johnrengelman.shadow' version '8.0.0'
    id 'maven-publish'
}

group = 'dev.sora.relay'
version = '1.4.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { 
        url = 'https://repo.opencollab.dev/maven-releases/'
        allowInsecureProtocol = true  // HTTP kullanılıyorsa gerekli
    }
    maven { 
        url = 'https://repo.opencollab.dev/maven-snapshots/'
        allowInsecureProtocol = true
    }
    maven { 
        url = 'https://mccheatz.github.io/maven_repo/'
        allowInsecureProtocol = true
    }
    // Cloudburst Protocol için ek repo
    maven {
        url = 'https://repo.cloudburstmc.org/releases'
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.2")

    embed('org.cloudburstmc.protocol:bedrock-connection:3.0.0.Beta1-SNAPSHOT') {
        exclude group: 'com.nukkitx', module: 'natives'
    }

    embed 'com.google.code.gson:gson:2.10.1'
    embed('coelho.msftauth:minecraft-msftauth:2.1.6') {
        exclude group: 'com.squareup.okhttp3'
    }
    embed 'io.github._0x9fff00.leveldb:leveldb:0.10.2'
    embed('com.squareup.okhttp3:okhttp:4.11.0') {
        exclude group: 'org.jetbrains.kotlin'
    }
    
    // Eksik bağımlılıklar için alternatifler
    embed 'org.iq80.leveldb:leveldb:0.12' // Alternatif LevelDB implementasyonu
}

kotlin {
    jvmToolchain(17) // JDK 17'ye yükseltildi (Gradle 8.0+ uyumluluğu için)
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.embed]
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    
    // Paketleme sorunları için manifest ayarları
    manifest {
        attributes 'Main-Class': 'dev.sora.relay.MainKt' // Main class belirtin
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
            artifactId = 'relay'
        }
    }
}
